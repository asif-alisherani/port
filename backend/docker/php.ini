; Production PHP settings for the container
upload_max_filesize = 200M
post_max_size = 250M
max_file_uploads = 50
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
